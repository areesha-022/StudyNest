
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyNest - Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📚 StudyNest</h1>

        <p class="subtitle">Your simple study planner</p>

        <div class="task-input">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your study task..."
            >

            <button onclick="addTask()">Add Task</button>
        </div>

        <p id="taskCount">Total Tasks: 0</p>
        <p id="completedCount">Completed: 0</p>
        <button onclick="clearCompleted()">Clear Completed</button>
        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
